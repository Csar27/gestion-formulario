<div class="contenedor">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Actualizar contraseña</mat-card-title>
      <mat-card-subtitle>Tu cuenta requiere una contraseña propia antes de continuar.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="enviar()">
        <mat-form-field appearance="outline">
          <mat-label>Contraseña actual</mat-label>
          <input matInput type="password" formControlName="passwordActual" autocomplete="current-password" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Contraseña nueva</mat-label>
          <input matInput type="password" formControlName="passwordNueva" autocomplete="new-password" />
          @if (form.controls.passwordNueva.hasError('minlength')) {
            <mat-error>Debe tener al menos 8 caracteres.</mat-error>
          }
        </mat-form-field>
        <div class="acciones">
          <button mat-button type="button" (click)="omitir()">Ahora no</button>
          <button mat-flat-button color="primary" type="submit">Guardar</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
