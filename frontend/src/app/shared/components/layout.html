<mat-sidenav-container class="contenedor">
  <mat-sidenav #menuLateral [mode]="esMovil() ? 'over' : 'side'" [opened]="abierto()" class="menu-lateral">
    <div class="marca">
      <mat-icon>assignment</mat-icon>
      <span>Gestión de Formularios</span>
    </div>
    <mat-nav-list>
      @for (item of menu(); track item.ruta) {
        @if (puedeVer(item.permiso)) {
          <a
            mat-list-item
            [routerLink]="item.ruta"
            routerLinkActive="activo"
            [routerLinkActiveOptions]="{ exact: false }"
          >
            <mat-icon matListItemIcon>{{ item.icono }}</mat-icon>
            <span matListItemTitle>{{ item.etiqueta }}</span>
          </a>
        }
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="barra">
      <button mat-icon-button (click)="menuLateral.toggle()" aria-label="Alternar menú">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="espaciador"></span>
      <span class="usuario">{{ nombreUsuario() }}</span>
      <button mat-icon-button (click)="theme.alternar()" [matTooltip]="theme.oscuro() ? 'Modo claro' : 'Modo oscuro'" aria-label="Cambiar tema">
        <mat-icon>{{ theme.oscuro() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button mat-icon-button matTooltip="Cerrar sesión" (click)="cerrarSesion()" aria-label="Cerrar sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <main class="contenido">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
